<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蝦皮打單資料自動轉單工具</title>
  <!-- 載入 SheetJS Excel 處理核心 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --primary: #ee4d2d;
      --primary-hover: #d73818;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --badge-plus: #e0f2fe;
      --badge-plus-text: #0369a1;
      --badge-mul: #fef3c7;
      --badge-mul-text: #b45309;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 28px;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-sub);
      font-size: 15px;
      margin: 0;
    }

    /* 檔案上傳區塊 */
    .upload-box {
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      background: var(--card-bg);
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 24px;
    }

    .upload-box:hover, .upload-box.dragover {
      border-color: var(--primary);
      background: #fffafa;
    }

    .upload-box input[type="file"] {
      display: none;
    }

    .upload-btn {
      background-color: var(--primary);
      color: white;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: 600;
      display: inline-block;
      margin-top: 12px;
      transition: 0.2s;
    }

    .upload-btn:hover {
      background-color: var(--primary-hover);
    }

    /* 統計資訊卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
      display: none;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .stat-card .label {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 24px;
      font-weight: bold;
      color: var(--text-main);
    }

    /* 控制與下載按鈕 */
    .action-bar {
      display: none;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: var(--card-bg);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .btn-download {
      background-color: #10b981;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-download:hover {
      background-color: #059669;
    }

    /* 資料預覽表格 */
    .table-container {
      overflow-x: auto;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      display: none;
      max-height: 650px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      background-color: #f1f5f9;
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 12px 14px;
      font-weight: 600;
      color: #334155;
      border-bottom: 2px solid var(--border-color);
      white-space: nowrap;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border-color);
      color: #475569;
      vertical-align: middle;
      white-space: nowrap;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 6px;
    }

    .badge-plus {
      background-color: var(--badge-plus);
      color: var(--badge-plus-text);
    }

    .badge-mul {
      background-color: var(--badge-mul);
      color: var(--badge-mul-text);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>蝦皮訂單打單資料轉單工具</h1>
      <p>支援多入組合 (+號拆行拆貨號) 與單入多件組合，活動價格自動平攤，原價維持整數</p>
    </div>

    <!-- 檔案上傳區 -->
    <div class="upload-box" id="dropArea">
      <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" />
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="#94a3b8" viewBox="0 0 24 24" style="margin-bottom: 10px;">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm1 14h-3v3h-2v-3H7v-2h3v-3h2v3h3v2zm-2-9V3.5L18.5 9H13z"/>
      </svg>
      <h3 style="margin: 0 0 8px 0; color: #334155;">點擊或拖曳蝦皮 Excel 訂單報表到此處</h3>
      <p style="margin: 0; color: #64748b; font-size: 13px;">支援 .xlsx、.xls、.csv 格式</p>
      <span class="upload-btn">選擇檔案</span>
    </div>

    <!-- 統計卡片 -->
    <div class="stats-grid" id="statsGrid">
      <div class="stat-card">
        <div class="label">原始訂單列數</div>
        <div class="value" id="statOriginal">0</div>
      </div>
      <div class="stat-card">
        <div class="label">組合拆列 (+號) 執行計數</div>
        <div class="value" id="statPlus" style="color: #0284c7;">0</div>
      </div>
      <div class="stat-card">
        <div class="label">單入倍增 (x號) 執行計數</div>
        <div class="value" id="statMul" style="color: #d97706;">0</div>
      </div>
      <div class="stat-card">
        <div class="label">轉換後總計列數</div>
        <div class="value" id="statFinal" style="color: #10b981;">0</div>
      </div>
    </div>

    <!-- 操作按鈕列 -->
    <div class="action-bar" id="actionBar">
      <div>
        <span style="font-weight: 600; color: #334155;">資料預覽（預設呈現目標 11 欄位）</span>
        <span id="fileNameDisplay" style="margin-left: 12px; font-size: 13px; color: #64748b;"></span>
      </div>
      <button class="btn-download" id="downloadBtn">下載轉換完成 Excel</button>
    </div>

    <!-- 資料預覽表格 -->
    <div class="table-container" id="tableContainer">
      <table id="previewTable">
        <thead>
          <tr>
            <th>訂單編號</th>
            <th>商品選項名稱</th>
            <th>商品原價</th>
            <th>商品活動價格</th>
            <th>主商品貨號</th>
            <th>商品選項貨號</th>
            <th>數量</th>
            <th>收件地址</th>
            <th>收件者姓名</th>
            <th>買家備註</th>
            <th>備註</th>
          </tr>
        </thead>
        <tbody id="previewTbody"></tbody>
      </table>
    </div>
  </div>

  <script>
    // 欲顯示（保留顯示）的 11 個標準欄位名稱
    const TARGET_HEADERS = [
      "訂單編號",
      "商品選項名稱",
      "商品原價",
      "商品活動價格",
      "主商品貨號",
      "商品選項貨號",
      "數量",
      "收件地址",
      "收件者姓名",
      "買家備註",
      "備註"
    ];

    // Excel 欄位索引對應 (A=0, C=2, Z=25, AA=26, AB=27, AC=28, AD=29, AE=30, AF=31, AG=32, AH=33, AL=37, AM=38, AS=44, BC=54, BD=55)
    const DELETE_INDEXES = [2, 25, 27, 28]; // 徹底刪除的欄位：C(熱門商品), Z(商品ID), AB(規格ID), AC(蝦皮商品編碼)

    let finalHeaders = [];
    let processedRows = [];
    let displayData = [];
    let uploadFileName = "蝦皮打單資料";

    const dropArea = document.getElementById("dropArea");
    const fileInput = document.getElementById("fileInput");

    dropArea.addEventListener("click", () => fileInput.click());
    dropArea.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropArea.classList.add("dragover");
    });
    dropArea.addEventListener("dragleave", () => dropArea.classList.remove("dragover"));
    dropArea.addEventListener("drop", (e) => {
      e.preventDefault();
      dropArea.classList.remove("dragover");
      if (e.dataTransfer.files.length) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    fileInput.addEventListener("change", (e) => {
      if (e.target.files.length) {
        handleFile(e.target.files[0]);
      }
    });

    function handleFile(file) {
      uploadFileName = file.name.replace(/\.[^/.]+$/, "");
      document.getElementById("fileNameDisplay").innerText = `檔案來源：${file.name}`;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: "array" });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
        if (rawRows.length < 2) {
          alert("Excel 檔案內容或資料列不足。");
          return;
        }

        processOrders(rawRows);
      };
      reader.readAsArrayBuffer(file);
    }

    // 小數點格式化處理（保留最多 2 位小數）
    function formatPrice(val) {
      const num = parseFloat(val) || 0;
      return Math.round(num * 100) / 100;
    }

    // 商品原價專用格式化（無小數點，一律取整數）
    function formatIntPrice(val) {
      const num = parseFloat(val) || 0;
      return Math.round(num);
    }

    function processOrders(rawRows) {
      let headerRow = rawRows[0].map(h => String(h || "").trim());

      // 1. 修正 AM 欄位標題（僅保留「收件者電話」）
      if (headerRow[38]) {
        headerRow[38] = "收件者電話";
      }

      // 2. 建立剔除 C(2), Z(25), AB(27), AC(28) 後的欄位索引清單
      const keepIndexes = [];
      for (let i = 0; i < headerRow.length; i++) {
        if (!DELETE_INDEXES.includes(i)) {
          keepIndexes.push(i);
        }
      }

      finalHeaders = keepIndexes.map(idx => headerRow[idx]);

      // 取得關鍵欄位在原始列陣列中的 Index 索引
      const orderIdIdx   = 0;  // A: 訂單編號
      const optNameIdx   = 26; // AA: 商品選項名稱
      const origADIdx    = 29; // AD: 商品原價
      const origAEIdx    = 30; // AE: 商品活動價格
      const parentSkuIdx = 31; // AF: 主商品貨號
      const skuValIdx    = 32; // AG: 商品選項貨號
      const qtyIdx       = 33; // AH: 數量
      const addrIdx      = 37; // AL: 收件地址
      const buyerNameIdx = 44; // AS: 收件者姓名
      const bRemarkIdx   = 54; // BC: 買家備註
      const remarkIdx    = 55; // BD: 備註

      processedRows = [];
      displayData = [];
      let plusCount = 0;
      let mulCount = 0;
      const originalRowCount = rawRows.length - 1;

      // 取得關鍵欄位在 finalHeaders (過濾後陣列) 中的新索引位址
      const newADIdx = finalHeaders.indexOf(headerRow[origADIdx]);
      const newAEIdx = finalHeaders.indexOf(headerRow[origAEIdx]);
      const newAFIdx = finalHeaders.indexOf(headerRow[parentSkuIdx]);
      const newAGIdx = finalHeaders.indexOf(headerRow[skuValIdx]);
      const newAHIdx = finalHeaders.indexOf(headerRow[qtyIdx]);

      // 逐列處理資料
      for (let i = 1; i < rawRows.length; i++) {
        const row = rawRows[i];
        const orderId = String(row[orderIdIdx] || "").trim();
        if (!orderId) continue; // 忽略無訂單編號的列

        const optName   = row[optNameIdx] || "";
        const rawADVal  = row[origADIdx];
        const intAD     = formatIntPrice(rawADVal); // 商品原價：無小數點整數
        const origAE    = parseFloat(row[origAEIdx]) || 0;
        const origAH    = parseInt(row[qtyIdx], 10) || 1;
        const addr      = row[addrIdx] || "";
        const buyerName = row[buyerNameIdx] || "";
        const bRemark   = row[bRemarkIdx] || "";
        const remark    = row[remarkIdx] || "";
        const skuVal    = String(row[skuValIdx] || "").trim();

        // 建立濾除 4 個指定刪除欄位後的列資料模板
        const filteredRowTemplate = keepIndexes.map(idx => row[idx] !== undefined ? row[idx] : "");

        // 規則一：AG 欄位 (商品選項貨號) 包含 "+" 多入組合拆行
        if (skuVal.includes("+")) {
          const skuParts = skuVal.split("+").map(s => s.trim()).filter(Boolean);
          plusCount++;

          // 計算該組組合總共包含幾件商品
          let totalUnitsPerSet = 0;
          const parsedParts = skuParts.map(part => {
            let cleanSku = part;
            let qty = 1;
            const mulMatch = part.match(/^(.+?)[xX*](\d+)$/);
            if (mulMatch) {
              cleanSku = mulMatch[1].trim();
              qty = parseInt(mulMatch[2], 10) || 1;
            }
            totalUnitsPerSet += qty;
            return { cleanSku, qty };
          });

          // 活動價格除以總件數，商品原價維持原原始整數值
          const calcAE = formatPrice(origAE / totalUnitsPerSet);

          parsedParts.forEach(item => {
            const rowQty = origAH * item.qty;

            const newRow = [...filteredRowTemplate];
            if (newADIdx !== -1) newRow[newADIdx] = intAD;
            if (newAEIdx !== -1) newRow[newAEIdx] = calcAE;
            if (newAFIdx !== -1) newRow[newAFIdx] = item.cleanSku; // 主商品貨號為純品號
            if (newAGIdx !== -1) newRow[newAGIdx] = item.cleanSku; // 商品選項貨號同步為純品號
            if (newAHIdx !== -1) newRow[newAHIdx] = rowQty;

            processedRows.push(newRow);

            displayData.push({
              "訂單編號": orderId,
              "商品選項名稱": optName,
              "商品原價": intAD,
              "商品活動價格": calcAE,
              "主商品貨號": item.cleanSku,
              "商品選項貨號": item.cleanSku,
              "數量": rowQty,
              "收件地址": addr,
              "收件者姓名": buyerName,
              "買家備註": bRemark,
              "備註": remark,
              "_badge": "PLUS"
            });
          });
        }
        // 規則二：單一品號帶有 "x數字" 倍數商品 (無 + 號，例：2040000112x2)
        else if (/[xX*]\d+$/.test(skuVal)) {
          const mulMatch = skuVal.match(/^(.*?)[xX*](\d+)$/);
          const cleanSku = mulMatch[1].trim();
          const mult = parseInt(mulMatch[2], 10) || 1;
          mulCount++;

          const calcQty = origAH * mult;
          const calcAE  = formatPrice(origAE / mult); // 活動價格除以數量

          const newRow = [...filteredRowTemplate];
          if (newADIdx !== -1) newRow[newADIdx] = intAD;
          if (newAEIdx !== -1) newRow[newAEIdx] = calcAE;
          if (newAFIdx !== -1) newRow[newAFIdx] = cleanSku; // 主商品貨號為純品號
          if (newAGIdx !== -1) newRow[newAGIdx] = skuVal;   // 商品選項貨號保留原字串 (如 2040000112x2)
          if (newAHIdx !== -1) newRow[newAHIdx] = calcQty;

          processedRows.push(newRow);

          displayData.push({
            "訂單編號": orderId,
            "商品選項名稱": optName,
            "商品原價": intAD,
            "商品活動價格": calcAE,
            "主商品貨號": cleanSku,
            "商品選項貨號": skuVal,
            "數量": calcQty,
            "收件地址": addr,
            "收件者姓名": buyerName,
            "買家備註": bRemark,
            "備註": remark,
            "_badge": "MUL"
          });
        }
        // 一般單一品號
        else {
          const parentSku = String(row[parentSkuIdx] || "").trim() || skuVal;

          const newRow = [...filteredRowTemplate];
          if (newADIdx !== -1) newRow[newADIdx] = intAD;
          if (newAEIdx !== -1) newRow[newAEIdx] = origAE;
          if (newAFIdx !== -1) newRow[newAFIdx] = parentSku;
          if (newAGIdx !== -1) newRow[newAGIdx] = skuVal;
          if (newAHIdx !== -1) newRow[newAHIdx] = origAH;

          processedRows.push(newRow);

          displayData.push({
            "訂單編號": orderId,
            "商品選項名稱": optName,
            "商品原價": intAD,
            "商品活動價格": origAE,
            "主商品貨號": parentSku,
            "商品選項貨號": skuVal,
            "數量": origAH,
            "收件地址": addr,
            "收件者姓名": buyerName,
            "買家備註": bRemark,
            "備註": remark,
            "_badge": null
          });
        }
      }

      // 更新統計數據
      document.getElementById("statOriginal").innerText = originalRowCount;
      document.getElementById("statPlus").innerText = `${plusCount} 筆`;
      document.getElementById("statMul").innerText = `${mulCount} 筆`;
      document.getElementById("statFinal").innerText = processedRows.length;

      renderPreviewTable();

      // 顯示表格與操作介面
      document.getElementById("statsGrid").style.display = "grid";
      document.getElementById("actionBar").style.display = "flex";
      document.getElementById("tableContainer").style.display = "block";
    }

    // 渲染資料預覽表 (呈現 11 個主要關注欄位)
    function renderPreviewTable() {
      const tbody = document.getElementById("previewTbody");
      tbody.innerHTML = "";

      displayData.forEach(row => {
        const tr = document.createElement("tr");

        let badgeHtml = "";
        if (row._badge === "PLUS") {
          badgeHtml = `<span class="badge badge-plus">+組合拆行拆號</span>`;
        } else if (row._badge === "MUL") {
          badgeHtml = `<span class="badge badge-mul">x組合數量倍增</span>`;
        }

        tr.innerHTML = `
          <td><strong>${row["訂單編號"]}</strong></td>
          <td>${row["商品選項名稱"]}</td>
          <td>${row["商品原價"]}</td>
          <td style="color: #ee4d2d; font-weight: bold;">${row["商品活動價格"]}</td>
          <td>${row["主商品貨號"]}</td>
          <td>${row["商品選項貨號"]} ${badgeHtml}</td>
          <td><strong>${row["數量"]}</strong></td>
          <td>${row["收件地址"]}</td>
          <td>${row["收件者姓名"]}</td>
          <td>${row["買家備註"]}</td>
          <td>${row["備註"]}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 下載轉換後的 Excel XLSX（保留完整原始欄位，僅隱藏非 11 個目標欄位）
    document.getElementById("downloadBtn").addEventListener("click", () => {
      if (!processedRows.length) return;

      const fullExportData = [finalHeaders, ...processedRows];
      const worksheet = XLSX.utils.aoa_to_sheet(fullExportData);

      // 設定欄位隱藏狀態 (!cols)
      const colProperties = finalHeaders.map(headerName => {
        const isVisible = TARGET_HEADERS.includes(headerName);
        return { hidden: !isVisible };
      });

      worksheet['!cols'] = colProperties;

      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "打單資料");

      const outName = `${uploadFileName}_打單資料已轉換.xlsx`;
      XLSX.writeFile(workbook, outName);
    });
  </script>
</body>
</html>
